<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GrowIA</title>
    <style>
 /* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(rgba(10, 40, 20, 0.75), rgba(10, 40, 20, 0.75)),
        url("https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=1600&q=80") center/cover no-repeat;
    color: #fff;
}

/* ===== TARJETA LOGIN ===== */
.login-container {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 50px 40px;
    width: 380px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

/* ===== TITULO ===== */
.login-container h2 {
    font-size: 32px;
    margin-bottom: 10px;
    font-weight: 600;
}

.login-container p {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 30px;
}

/* ===== INPUTS ===== */
.login-container input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 18px;
    border-radius: 12px;
    border: none;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
}

.login-container input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

.login-container input:focus {
    background: rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 0 2px #3ecf8e;
}

/* ===== BOTÓN ===== */
.login-container button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #1db954, #3ecf8e);
    color: #fff;
    transition: all 0.3s ease;
}

.login-container button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(30, 207, 142, 0.4);
}

/* Botón para volver a la web */
.login-container button:last-child {
    background: transparent;
    border: 2px solid #3ecf8e;
    margin-top: 10px;
}
/* ===== LINK ===== */
.login-container a {
    display: block;
    margin-top: 18px;
    font-size: 13px;
    color: #3ecf8e;
    text-decoration: none;
}

.login-container a:hover {
    text-decoration: underline;
}

/* ===== LOGO OPCIONAL ===== */
.logo {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 30px;
    color: #3ecf8e;
}

</style>
</head>
<body>
  <div class="login-container">
    <!-- Logo de tu web -->
    <img src="Logo-GrowIA.png" alt="Logo de mi sitio" width="150" height="auto">
    <h2>Iniciar Sesión</h2>
    <p>Accede a tu dashboard inteligente</p>
<form action="/login" method="POST">
  <input type="text" name="user" placeholder="Usuario" required>
  <input type="password" name="pass" placeholder="Contraseña" required>
  <button type="submit">Entrar</button>
  

</form>
</body>
</html>
